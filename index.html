<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Nuestro Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

<body>

    <button id="btnMusica">MS</button>

            <h1>Nuestra Historia</h1>

        <!-- Páginas de fotos -->
        <div class="page">
            <img src="https://github.com/LuisTurizo/NuestroLibro/blob/main/Assets/Img/Nosotros.jpg?raw=true" alt="Foto 1">
            <p>Te amo mucho</p>
        </div>
        <div class="page">
            <img src="Assets/Img/NosotrosVghibli.jpg" alt="Foto 2">
            <p>Version Ghibli</p>
        </div>
        <!---------------------------------------------------------------------------->
        <div class="page">
          <img src="Assets/Img/Carnavales.jpg" alt="Foto 3">
          <p>Carnavales</p>
        </div>
          <!---------------------------------------------------------------------------->
          <div class="page">
            <img src="Assets/Img/Graduacio.jpg" alt="Foto 4">
            <p>Con su regalito de graduacion</p>

      <!---------------------------------------------------------------------------->
          <!---------------------------------------------------------------------------->
          <div class="page">
            <img src="Assets/Img/Playita.jpg" alt="Foto 4">

      </div>
        <!---------------------------------------------------------------------------->
                <div class="page">
                  <img src="Assets/Img/Versionghibli2.jpg" alt="Foto 4">
                  <p>Otra vez version ghibli</p>
            </div>
            <!---------------------------------------------------------------------------->
                <!---------------------------------------------------------------------------->
                <div class="page">
                  <img src="Assets/Img/Salida en los robles.jpg" alt="Foto 4">
                  <p>Salida a los robles</p>
            </div>
            <!---------------------------------------------------------------------------->
                            <!---------------------------------------------------------------------------->
                            <div class="page">
                              <img src="Assets/Img/Playita2.jpg" alt="Foto 4">
                              <p>Otra vez playita</p>
                        </div>
                        <!---------------------------------------------------------------------------->
    </div>

    <!-- Botones -->
    <button class="btn prev">⬅️ Anterior</button>
    <button class="btn next">➡️ Siguiente</button>

    <div id="libro"></div>

    <script src="script.js"></script>

</html>
